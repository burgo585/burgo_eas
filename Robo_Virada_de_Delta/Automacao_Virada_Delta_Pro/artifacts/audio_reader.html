<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Leitor de Áudio Institucional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8;
      --accent: #38bdf8; --accent-hover: #0284c7; --success: #22c55e; --danger: #ef4444; --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 14px; display: flex; justify-content: center; align-items: center; }
    .audio-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; width: 100%; max-width: 760px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.45); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    .title { font-size: 15px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .settings-container { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .setting-group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-sub); }
    select { background: #0f172a; color: var(--text-main); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 13px; cursor: pointer; outline: none; }
    .vol-icon { cursor: pointer; font-size: 16px; user-select: none; transition: transform 0.15s ease; display: inline-block; width: 22px; text-align: center; }
    .vol-icon:hover { transform: scale(1.2); }
    .vol-slider { width: 85px; height: 5px; accent-color: var(--accent); cursor: pointer; }
    .vol-label { font-size: 12px; min-width: 32px; color: var(--text-sub); }
    .progress-bar-container { width: 100%; height: 6px; background: #334155; border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #22c55e); transition: width 0.25s ease; }
    .text-display { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-height: 85px; margin-bottom: 14px; display: flex; flex-direction: column; justify-content: center; }
    .sentence-text { font-size: 14px; line-height: 1.55; color: var(--text-main); }
    .counter { font-size: 11px; color: var(--text-sub); margin-top: 8px; text-align: right; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
    .btn-group { display: flex; gap: 8px; }
    button { background: #334155; color: #f8fafc; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s ease; }
    button:hover { background: #475569; }
    button.primary { background: var(--accent); color: #0f172a; }
    button.primary:hover { background: var(--accent-hover); color: #ffffff; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: var(--danger); }
  </style>
</head>
<body>
  <div class="audio-card">
    <div class="header">
      <div class="title"><span>🎧</span> Leitor de Resposta - Robô Virada de Delta Pro</div>
      <div class="settings-container">
        <div class="setting-group" title="Volume da voz">
          <span class="vol-icon" id="volIcon" onclick="toggleMute()" title="Mutar/Desmutar">🔊</span>
          <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="onVolumeInput(this.value)">
          <span class="vol-label" id="volPercent">100%</span>
        </div>
        <div class="setting-group">
          <label for="speedSelect">Velocidade:</label>
          <select id="speedSelect" onchange="changeSpeed(this.value)">
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="1.75">1.75x</option>
            <option value="2.0">2.0x</option>
          </select>
        </div>
      </div>
    </div>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <div class="text-display">
      <div class="sentence-text" id="sentenceDisplay">Clique em "Ouvir Resposta" para iniciar.</div>
      <div class="counter" id="counterDisplay">Aguardando início...</div>
    </div>
    <div class="controls">
      <div class="btn-group">
        <button class="primary" id="btnPlay" onclick="togglePlay()">▶️ Ouvir Resposta</button>
        <button class="danger" id="btnStop" onclick="stopAudio()">⏹️ Parar</button>
      </div>
      <div class="btn-group">
        <button id="btnPrev" onclick="prevSentence()">⏮️ Voltar</button>
        <button id="btnNext" onclick="nextSentence()">Avançar ⏭️</button>
      </div>
    </div>
  </div>

  <script>
    const fullText = `Olá! Realizamos com sucesso a otimização de alta performance e agilidade do Robô Virada de Delta Pro v3.1, garantindo zero congelamentos e renderização perfeita no MetaTrader 5.
Agora, o cálculo do perfil de volume roda exclusivamente na abertura de novas barras, e as marcações das linhas de POC, VAH e VAL são desenhadas diretamente no gráfico com atualização suave, sem piscar e sem sobrecarregar a interface.
Também implementamos a gestão protegida para bancas pequenas, convertendo a parcial de 0.01 lote em breakeven blindado para nunca falhar por limite de volume da corretora.
Executamos o teste causal estrito com 45 mil velas reais da sua conta XM MT5 com duzentos dólares de saldo inicial.
No Ouro, o robô dobrou a banca para 409 dólares e 96 centavos, com zero stop-outs, embora exija cautela com o rebaixamento em meses direcionais, recomendando 500 dólares para conforto.
No Bitcoin, a auditoria revelou que o spread elevado de 40 dólares e os custos de swap da corretora drenaram a banca pequena para 80 dólares, comprovando que o ativo exige contas sem spread ou alvos mais longos.
O novo executável compilado com zero erros já está no seu MetaTrader e versionado no Git.`;

    function safeGetStorage(k, def) {
      try { return (window.localStorage && window.localStorage.getItem(k)) || def; } catch (e) { return def; }
    }
    function safeSetStorage(k, v) {
      try { if (window.localStorage) window.localStorage.setItem(k, v); } catch (e) {}
    }
    function splitSentences(text) {
      const raw = text.match(/[^.!?\n]+[.!?\n]+/g) || [text];
      return raw.map(s => s.trim()).filter(s => s.length > 0);
    }

    const sentences = splitSentences(fullText);
    let currentIndex = 0, isPlaying = false, isPaused = false, currentRate = 1.0;
    let currentVolume = parseFloat(safeGetStorage('antigravity_audio_volume', '1.0'));
    let previousVolume = currentVolume > 0 ? currentVolume : 1.0;
    let synth = window.speechSynthesis, ptVoice = null, volumeDebounce = null, activeUtterance = null;

    function initVoice() {
      if (!synth) return;
      try {
        const voices = synth.getVoices();
        ptVoice = voices.find(v => v.lang === 'pt-BR' || v.lang === 'pt_BR') || voices.find(v => v.lang.startsWith('pt')) || null;
      } catch (e) {}
    }
    if (typeof window !== 'undefined' && window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = initVoice;
    }

    function updateVolumeLabel(val) {
      const icon = document.getElementById('volIcon'), label = document.getElementById('volPercent');
      if (label) label.innerText = Math.round(val * 100) + '%';
      if (icon) icon.innerText = val <= 0.01 ? '🔇' : val < 0.35 ? '🔈' : val < 0.75 ? '🔉' : '🔊';
    }
    function initVolumeUI() {
      const slider = document.getElementById('volSlider');
      if (slider) slider.value = currentVolume;
      updateVolumeLabel(currentVolume);
    }
    function onVolumeInput(val) {
      currentVolume = parseFloat(val);
      safeSetStorage('antigravity_audio_volume', currentVolume.toString());
      updateVolumeLabel(currentVolume);
      if (volumeDebounce) clearTimeout(volumeDebounce);
      if (isPlaying && !isPaused) volumeDebounce = setTimeout(playCurrentSentence, 220);
    }
    function toggleMute() {
      const slider = document.getElementById('volSlider');
      if (currentVolume > 0.01) { previousVolume = currentVolume; currentVolume = 0; }
      else { currentVolume = previousVolume > 0.05 ? previousVolume : 1.0; }
      if (slider) slider.value = currentVolume;
      safeSetStorage('antigravity_audio_volume', currentVolume.toString());
      updateVolumeLabel(currentVolume);
      if (isPlaying && !isPaused) playCurrentSentence();
    }
    function updateUI() {
      const display = document.getElementById('sentenceDisplay'), counter = document.getElementById('counterDisplay');
      const pBar = document.getElementById('progressBar'), btnPlay = document.getElementById('btnPlay');
      if (currentIndex < sentences.length) {
        if (display) display.innerText = sentences[currentIndex];
        if (counter) counter.innerText = 'Trecho ' + (currentIndex + 1) + ' de ' + sentences.length;
        if (pBar) pBar.style.width = (((currentIndex + 1) / sentences.length) * 100) + '%';
      } else {
        if (display) display.innerText = 'Reprodução concluída.';
        if (counter) counter.innerText = sentences.length + ' de ' + sentences.length;
        if (pBar) pBar.style.width = '100%';
        if (btnPlay) btnPlay.innerText = '▶️ Ouvir Novamente';
        isPlaying = false; isPaused = false;
      }
    }
    function playCurrentSentence() {
      if (!synth || currentIndex >= sentences.length) { isPlaying = false; isPaused = false; updateUI(); return; }
      try { synth.cancel(); } catch (e) {}
      initVoice();
      const utter = new SpeechSynthesisUtterance(sentences[currentIndex]);
      utter.lang = 'pt-BR';
      if (ptVoice) utter.voice = ptVoice;
      utter.rate = currentRate;
      utter.volume = currentVolume;
      utter.pitch = 1.0;
      activeUtterance = utter;
      utter.onend = () => {
        activeUtterance = null;
        if (isPlaying && !isPaused) {
          currentIndex++;
          if (currentIndex < sentences.length) { updateUI(); playCurrentSentence(); }
          else { updateUI(); }
        }
      };
      utter.onerror = (e) => { if (e.error === 'interrupted' || e.error === 'canceled') return; };
      updateUI();
      setTimeout(() => {
        try { if (synth.paused) synth.resume(); synth.speak(utter); } catch (err) {}
      }, 40);
    }
    function togglePlay() {
      const btnPlay = document.getElementById('btnPlay');
      initVoice();
      if (!isPlaying && !isPaused) {
        isPlaying = true; isPaused = false;
        if (currentIndex >= sentences.length) currentIndex = 0;
        if (btnPlay) btnPlay.innerText = '⏸️ Pausar';
        playCurrentSentence();
      } else if (isPlaying && !isPaused) {
        isPlaying = true; isPaused = true;
        try { synth.cancel(); } catch (e) {}
        if (btnPlay) btnPlay.innerText = '▶️ Continuar';
      } else if (isPlaying && isPaused) {
        isPlaying = true; isPaused = false;
        if (btnPlay) btnPlay.innerText = '⏸️ Pausar';
        playCurrentSentence();
      }
    }
    function stopAudio() {
      try { synth.cancel(); } catch (e) {}
      activeUtterance = null; isPlaying = false; isPaused = false; currentIndex = 0;
      const btnPlay = document.getElementById('btnPlay'), display = document.getElementById('sentenceDisplay');
      const counter = document.getElementById('counterDisplay'), pBar = document.getElementById('progressBar');
      if (btnPlay) btnPlay.innerText = '▶️ Ouvir Resposta';
      if (display) display.innerText = 'Reprodução interrompida. Clique para iniciar novamente.';
      if (counter) counter.innerText = 'Parado';
      if (pBar) pBar.style.width = '0%';
    }
    function nextSentence() {
      if (currentIndex < sentences.length - 1) { currentIndex++; updateUI(); if (isPlaying && !isPaused) playCurrentSentence(); }
    }
    function prevSentence() {
      if (currentIndex > 0) { currentIndex--; updateUI(); if (isPlaying && !isPaused) playCurrentSentence(); }
    }
    function changeSpeed(val) {
      currentRate = parseFloat(val);
      if (isPlaying && !isPaused) playCurrentSentence();
    }
    window.addEventListener('DOMContentLoaded', () => { initVoice(); initVolumeUI(); });
  </script>
</body>
</html>
