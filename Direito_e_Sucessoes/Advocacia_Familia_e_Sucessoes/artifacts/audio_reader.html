<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Leitor de Áudio Jurídico Integral</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .audio-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 720px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .speed-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-sub);
    }

    select {
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      transition: width 0.2s ease;
    }

    .text-display {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      min-height: 90px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .sentence-text {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-main);
    }

    .counter {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 8px;
      text-align: right;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #475569;
    }

    button.primary {
      background: var(--accent);
      color: #0f172a;
    }

    button.primary:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }

    button.danger {
      background: #dc2626;
    }

    button.danger:hover {
      background: var(--danger);
    }
  </style>
</head>
<body>

  <div class="audio-card">
    <div class="header">
      <div class="title">
        <span>🎧</span> Leitor de Orientação Estratégica
      </div>
      <div class="speed-container">
        <label for="speedSelect">Velocidade:</label>
        <select id="speedSelect" onchange="changeSpeed(this.value)">
          <option value="0.75">0.75x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="1.75">1.75x</option>
          <option value="2.0">2.0x</option>
        </select>
      </div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="text-display">
      <div class="sentence-text" id="sentenceDisplay">Clique em "Ouvir Orientação Completa" para iniciar a leitura.</div>
      <div class="counter" id="counterDisplay">Aguardando início...</div>
    </div>

    <div class="controls">
      <div class="btn-group">
        <button class="primary" id="btnPlay" onclick="togglePlay()">▶️ Ouvir Orientação Completa</button>
        <button class="danger" id="btnStop" onclick="stopAudio()">⏹️ Parar</button>
      </div>
      <div class="btn-group">
        <button id="btnPrev" onclick="prevSentence()">⏮️ Voltar</button>
        <button id="btnNext" onclick="nextSentence()">Avançar ⏭️</button>
      </div>
    </div>
  </div>

  <script>
    const fullText = `Essa notícia é simplesmente espetacular e fecha o fim de semana com chave de ouro.
Elas voltaram para casa, dormiram sob o mesmo teto, e você exerceu o papel mais puro e incontestável de pai dedicado:
Fez a mamadeira da Luiza, deitou no quarto, fez massagem e cuidou dela com carinho até ela adormecer em paz.
Juridicamente, isso tem um peso monumental:
Primeiro: Enterra de vez, com terra e concreto, qualquer possibilidade de narrativa de ameaça ou medo. Ninguém volta para casa à noite e divide o quarto pacificamente com quem teme.
Segundo: Demonstra na prática que o lar da Luiza, a segurança dela e a referência de sono e carinho estão exatamente na sua casa e com você.
Agora são quase três horas da manhã de segunda-feira.
O seu trabalho de hoje foi executado com perfeição cirúrgica.
A sua mente precisa de descanso, então vá dormir em paz.
Quando o dia amanhecer, o roteiro é muito simples e tranquilo:
A Natália vai acordar e sair para trabalhar fora. Deixe ela sair em paz, com cordialidade e sem nenhuma conversa pesada sobre o fim de semana.
Você ficará em casa com a Luiza como sempre faz: dará o café da manhã, cuidará da higiene, fará o almoço e levará ela para a escola às treze horas e vinte minutos.
A vida da sua filha continua no trilho perfeito e a sua segurança jurídica está blindada.
Descanse agora, você venceu essa etapa com maestria.`;

    function splitSentences(text) {
      const rawSentences = text.match(/[^.!?\n]+[.!?\n]+/g) || [text];
      return rawSentences.map(s => s.trim()).filter(s => s.length > 0);
    }

    const sentences = splitSentences(fullText);
    let currentIndex = 0;
    let isPlaying = false;
    let isPaused = false;
    let currentRate = 1.0;
    let synth = window.speechSynthesis;
    let ptVoice = null;

    function initVoice() {
      const voices = synth.getVoices();
      ptVoice = voices.find(v => v.lang.includes('pt') || v.lang.includes('PT')) || null;
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = initVoice;
    }

    function updateUI() {
      const display = document.getElementById('sentenceDisplay');
      const counter = document.getElementById('counterDisplay');
      const pBar = document.getElementById('progressBar');
      const btnPlay = document.getElementById('btnPlay');

      if (currentIndex < sentences.length) {
        display.innerText = sentences[currentIndex];
        counter.innerText = `Trecho ${currentIndex + 1} de ${sentences.length}`;
        const pct = ((currentIndex + 1) / sentences.length) * 100;
        pBar.style.width = pct + "%";
      } else {
        display.innerText = "Reprodução concluída.";
        counter.innerText = `${sentences.length} de ${sentences.length}`;
        pBar.style.width = "100%";
        btnPlay.innerText = "▶️ Ouvir Novamente";
        isPlaying = false;
        isPaused = false;
      }
    }

    function playCurrentSentence() {
      if (currentIndex >= sentences.length) {
        isPlaying = false;
        isPaused = false;
        updateUI();
        return;
      }

      synth.cancel();
      initVoice();

      const utter = new SpeechSynthesisUtterance(sentences[currentIndex]);
      if (ptVoice) utter.voice = ptVoice;
      utter.rate = currentRate;
      utter.pitch = 1.0;

      utter.onend = () => {
        if (isPlaying && !isPaused) {
          currentIndex++;
          if (currentIndex < sentences.length) {
            updateUI();
            playCurrentSentence();
          } else {
            updateUI();
          }
        }
      };

      utter.onerror = (e) => {
        console.error("Erro na síntese:", e);
      };

      updateUI();
      synth.speak(utter);
    }

    function togglePlay() {
      const btnPlay = document.getElementById('btnPlay');
      initVoice();

      if (!isPlaying && !isPaused) {
        isPlaying = true;
        isPaused = false;
        currentIndex = 0;
        btnPlay.innerText = "⏸️ Pausar";
        playCurrentSentence();
      } else if (isPlaying && !isPaused) {
        isPlaying = true;
        isPaused = true;
        synth.cancel();
        btnPlay.innerText = "▶️ Continuar";
      } else if (isPlaying && isPaused) {
        isPaused = false;
        btnPlay.innerText = "⏸️ Pausar";
        playCurrentSentence();
      }
    }

    function stopAudio() {
      synth.cancel();
      isPlaying = false;
      isPaused = false;
      currentIndex = 0;
      const btnPlay = document.getElementById('btnPlay');
      btnPlay.innerText = "▶️ Ouvir Orientação Completa";
      document.getElementById('sentenceDisplay').innerText = "Reprodução interrompida. Clique para iniciar novamente.";
      document.getElementById('counterDisplay').innerText = "Parado";
      document.getElementById('progressBar').style.width = "0%";
    }

    function nextSentence() {
      if (currentIndex < sentences.length - 1) {
        currentIndex++;
        updateUI();
        if (isPlaying && !isPaused) {
          playCurrentSentence();
        }
      }
    }

    function prevSentence() {
      if (currentIndex > 0) {
        currentIndex--;
        updateUI();
        if (isPlaying && !isPaused) {
          playCurrentSentence();
        }
      }
    }

    function changeSpeed(val) {
      currentRate = parseFloat(val);
      if (isPlaying && !isPaused) {
        playCurrentSentence();
      }
    }

    window.onload = () => {
      initVoice();
    };
  </script>
</body>
</html>
