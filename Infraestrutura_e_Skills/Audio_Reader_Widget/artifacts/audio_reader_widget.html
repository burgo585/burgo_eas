<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-4 shadow-sm max-w-lg mx-auto">
    <div class="flex items-center justify-between gap-3 mb-3">
      <div class="flex items-center gap-2">
        <span class="text-xl">🎙️</span>
        <div>
          <h3 class="font-semibold text-sm text-[var(--foreground)]">Leitor de Resposta (Voz)</h3>
          <p class="text-xs text-[var(--muted-foreground)]">Clique para testar o leitor de voz</p>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <label for="speedSelect" class="text-xs text-[var(--muted-foreground)]">Velocidade:</label>
        <select id="speedSelect" class="text-xs bg-[var(--background)] border border-[var(--border)] rounded px-1.5 py-1 text-[var(--foreground)] focus:outline-none">
          <option value="0.8">0.8x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-2">
      <button id="playBtn" class="flex-1 flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs py-2 px-3 rounded-lg transition-colors shadow-sm">
        <span id="playIcon">▶️</span>
        <span id="playText">Ouvir Demonstração</span>
      </button>
      <button id="pauseBtn" class="hidden flex items-center justify-center gap-1 bg-amber-600 hover:bg-amber-700 text-white font-medium text-xs py-2 px-3 rounded-lg transition-colors shadow-sm">
        <span>⏸️</span>
        <span>Pausar</span>
      </button>
      <button id="stopBtn" class="flex items-center justify-center gap-1 bg-[var(--border)] hover:bg-[var(--muted-foreground)]/20 text-[var(--foreground)] font-medium text-xs py-2 px-3 rounded-lg transition-colors">
        <span>⏹️</span>
        <span>Parar</span>
      </button>
    </div>

    <div id="statusText" class="mt-2 text-xs text-[var(--muted-foreground)] flex items-center gap-1">
      <span>Pronto para reproduzir.</span>
    </div>
  </div>

  <script>
    const textToRead = "Sim! É perfeitamente possível ter um leitor de voz para você escutar as minhas respostas. Podemos colocar um player interativo aqui no chat, ou configurar um leitor no Windows com vozes neurais ultra-realistas que lê tudo automaticamente para você!";

    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const speedSelect = document.getElementById('speedSelect');
    const statusText = document.getElementById('statusText');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');

    let synth = window.speechSynthesis;
    let utterance = null;
    let isSpeaking = false;
    let isPaused = false;

    function getPtBrVoice() {
      if (!synth) return null;
      const voices = synth.getVoices();
      return voices.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt_BR')) ||
             voices.find(v => v.lang.startsWith('pt')) || null;
    }

    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = () => {};
    }

    playBtn.addEventListener('click', () => {
      if (!synth) {
        statusText.textContent = "Aviso: Síntese de voz não suportada pelo navegador.";
        return;
      }

      if (isPaused) {
        synth.resume();
        isPaused = false;
        isSpeaking = true;
        updateUI();
        return;
      }

      if (isSpeaking) {
        synth.cancel();
      }

      utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.lang = 'pt-BR';
      utterance.rate = parseFloat(speedSelect.value);

      const voice = getPtBrVoice();
      if (voice) {
        utterance.voice = voice;
      }

      utterance.onstart = () => {
        isSpeaking = true;
        isPaused = false;
        updateUI();
      };

      utterance.onend = () => {
        isSpeaking = false;
        isPaused = false;
        updateUI();
      };

      utterance.onerror = (e) => {
        console.error('Speech error', e);
        isSpeaking = false;
        isPaused = false;
        statusText.textContent = "Reprodução concluída ou cancelada.";
        updateUI();
      };

      synth.speak(utterance);
    });

    pauseBtn.addEventListener('click', () => {
      if (synth && isSpeaking && !isPaused) {
        synth.pause();
        isPaused = true;
        updateUI();
      }
    });

    stopBtn.addEventListener('click', () => {
      if (synth) {
        synth.cancel();
        isSpeaking = false;
        isPaused = false;
        updateUI();
      }
    });

    function updateUI() {
      if (isSpeaking && !isPaused) {
        pauseBtn.classList.remove('hidden');
        playIcon.textContent = "🔊";
        playText.textContent = "Falando...";
        statusText.innerHTML = "<span class='text-green-500'>●</span> Reproduzindo áudio...";
      } else if (isPaused) {
        pauseBtn.classList.add('hidden');
        playIcon.textContent = "▶️";
        playText.textContent = "Continuar";
        statusText.innerHTML = "<span class='text-amber-500'>●</span> Pausado.";
      } else {
        pauseBtn.classList.add('hidden');
        playIcon.textContent = "▶️";
        playText.textContent = "Ouvir Demonstração";
        statusText.textContent = "Pronto para reproduzir.";
      }
    }
  </script>
</body>
</html>
